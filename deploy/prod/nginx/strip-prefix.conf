# RustDesk Web Console 外層 nginx 範例（剝除前綴：外層去掉 __BASE__ 後才轉給 web 容器。）
# 放在既有 nginx 的 http {} 內（例如 /etc/nginx/conf.d/rdweb.conf），替換：
#   __SERVER_NAME__  對外網域；__CERT__／__KEY__  TLS 憑證與私鑰路徑
#   __BASE__         APP_BASE_PATH（不含結尾斜線，例如 /rdweb）；掛在根目錄時設為空字串，並刪除標示「子路徑專用」的行
#   __UPSTREAM__     web 容器發布的位址（rdweb.conf 的 RDWEB_BIND，預設 127.0.0.1:8080）
# 本 nginx 連到 web 的來源位址須列在 rdweb.conf 的 OUTER_PROXY_ADDRESSES。
map $http_upgrade $rdweb_connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 443 ssl;
  server_name __SERVER_NAME__;
  ssl_certificate __CERT__;
  ssl_certificate_key __KEY__;
  # 相對 Location，避免 nginx 以內部 listen port 組出錯誤的轉址。
  absolute_redirect off;
  location = __BASE__ { return 301 __BASE__/; } # 子路徑專用
  location __BASE__/ {
    proxy_pass http://__UPSTREAM__/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    # 遠端桌面使用長時間 WebSocket，必須允許升級並放寬逾時、關閉緩衝。
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rdweb_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
