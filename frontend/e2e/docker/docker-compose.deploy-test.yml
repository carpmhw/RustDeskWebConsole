# 只供 test-m4-deploy.sh 疊加在 deploy/prod/compose.yml 之後：資料綁到 runner 擁有的暫存目錄，
# 加入容器化外層 nginx（模擬既有主機 nginx）、固定 IP 探測容器，並讓 backend 連到官方 RustDesk fixture 網路（模擬另一台主機）。
services:
  backend:
    volumes:
      - type: bind
        source: ${RDWEB_M4_DATA_DIR:?}
        target: /app/data
    networks: [rdweb, official-rustdesk]
  outer:
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    volumes:
      - ${RDWEB_M4_OUTER_CONF:?}:/etc/nginx/conf.d/default.conf:ro
      - ${RDWEB_M4_TLS_DIR:?}:/etc/rdweb-tls:ro
    ports:
      - 127.0.0.1:18443:443
    depends_on:
      web:
        condition: service_healthy
    # 任何 HTTP 回應即代表外層已接受連線；不以狀態碼判斷，因根路徑在子路徑部署下為 404。
    healthcheck:
      test: [CMD, curl, --insecure, --silent, --output, /dev/null, https://127.0.0.1/]
      interval: 2s
      timeout: 5s
      retries: 15
    logging:
      driver: none
    networks:
      rdweb:
        ipv4_address: 172.31.81.10
  probe:
    image: rdweb-web:local
    profiles: [probe]
    entrypoint: [curl]
    logging:
      driver: none
    networks:
      rdweb:
        ipv4_address: 172.31.81.20
networks:
  official-rustdesk:
    external: true
    name: rdweb-rustdesk-test_default
