# 僅reconnect runner把ingress綁18081；browser仍18080，不改正式Origin驗證。
services:
  ingress:
    labels:
      rdweb.test.reconnect-ingress-owner: ${RDWEB_RECONNECT_INGRESS_OWNER:-}
  backend:
    environment:
      APP_PUBLIC_URL: http://127.0.0.1:18080${APP_BASE_PATH:-/}
      # 只有 reconnect-security runner 設定：Development 下把時間上限的 1 小時縮為此秒數；空值維持 1 小時。
      RDWEB_TEST_CONNECTION_HOUR_SECONDS: ${RDWEB_TEST_CONNECTION_HOUR_SECONDS:-}
