<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Remote Desktop</title>
  <defs>
    <!-- 視窗外框：左下藍 → 右上薄荷綠 -->
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="217" y1="620" x2="1000" y2="330">
      <stop offset="0" stop-color="#0068ff"/>
      <stop offset="0.5" stop-color="#14c8ff"/>
      <stop offset="1" stop-color="#4dffd9"/>
    </linearGradient>
    <!-- 外框底部偏青色的補色 -->
    <linearGradient id="frameBottom" gradientUnits="userSpaceOnUse" x1="217" y1="990" x2="1036" y2="990">
      <stop offset="0" stop-color="#0a8cff" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#00f4f4" stop-opacity="1"/>
      <stop offset="1" stop-color="#2dffe0" stop-opacity="1"/>
    </linearGradient>
    <!-- 螢幕 -->
    <linearGradient id="screen" gradientUnits="userSpaceOnUse" x1="343" y1="850" x2="841" y2="470">
      <stop offset="0" stop-color="#17b0ff"/>
      <stop offset="0.6" stop-color="#10e6ff"/>
      <stop offset="1" stop-color="#33ffff"/>
    </linearGradient>
    <!-- 箭頭桿 -->
    <linearGradient id="shaft" gradientUnits="userSpaceOnUse" x1="725" y1="683" x2="905" y2="683">
      <stop offset="0" stop-color="#3dffff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <!-- 箭頭 -->
    <linearGradient id="chevron" gradientUnits="userSpaceOnUse" x1="875" y1="800" x2="1040" y2="600">
      <stop offset="0" stop-color="#1affec"/>
      <stop offset="1" stop-color="#56ffcc"/>
    </linearGradient>
  </defs>

  <!-- 背景圓角方塊 -->
  <rect x="25" y="22" width="1204" height="1208" rx="300" ry="300" fill="#191d27"/>

  <!-- 視窗外框（右側留缺口讓箭頭穿出） -->
  <path fill="url(#frame)" d="
    M 337,247 H 918
    A 118,118 0 0 1 1036,365
    V 595 Q 1036,601 1030,598
    L 978,557 V 460
    A 58,58 0 0 0 920,402
    H 335
    A 58,58 0 0 0 277,460
    V 862
    A 58,58 0 0 0 340,920
    H 915
    A 60,60 0 0 0 975,860
    V 808
    L 1030,768 Q 1036,765 1036,772
    V 872
    A 118,118 0 0 1 918,990
    H 337
    A 120,120 0 0 1 217,870
    V 367
    A 120,120 0 0 1 337,247 Z"/>
  <!-- 底部青色疊色 -->
  <path fill="url(#frameBottom)" opacity="0.55" d="
    M 217,800 V 870 A 120,120 0 0 0 337,990 H 918 A 118,118 0 0 0 1036,872 V 772 Q 1036,765 1030,768
    L 975,808 V 860 A 60,60 0 0 1 915,920 H 340 A 58,58 0 0 1 277,862 V 800 Z"/>

  <!-- 視窗標題列三個圓點 -->
  <g fill="#191d27">
    <circle cx="330" cy="331" r="30"/>
    <circle cx="418" cy="331" r="30"/>
    <circle cx="509" cy="331" r="30"/>
  </g>

  <!-- 螢幕外框（右側開口） -->
  <path fill="none" stroke="url(#screen)" stroke-width="50" stroke-linecap="butt" stroke-linejoin="round"
        d="M 817,629 V 545 Q 817,495 767,495 H 418 Q 368,495 368,545 V 745 Q 368,795 418,795 H 767 Q 817,795 817,745 V 733"/>
  <!-- 螢幕支架 -->
  <rect x="540" y="815" width="103" height="40" fill="url(#screen)"/>
  <rect x="481" y="849" width="220" height="46" rx="23" fill="url(#screen)"/>

  <!-- 箭頭桿 -->
  <path fill="url(#shaft)" d="M 748,660 H 880 L 903,683 Q 906,685 903,688 L 880,706 H 748 A 23,23 0 0 1 748,660 Z"/>

  <!-- 箭頭 -->
  <path fill="url(#chevron)" d="
    M 905,568 Q 918,568 927,575
    L 1025,652 Q 1043,668 1040,688
    Q 1038,705 1022,718
    L 925,795 Q 915,801 903,801
    Q 875,799 875,770 Q 875,755 885,745
    L 935,697 Q 938,685 935,682
    L 885,632 Q 875,620 875,600
    Q 875,570 905,568 Z"/>
</svg>
